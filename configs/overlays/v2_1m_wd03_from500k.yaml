# Ceiling check from Phase1/Phase2 boundary (500k hostnet parent).
# Not an unpublished NVIDIA recipe.
#
# Parent: runs/v2-1m-hostnet/checkpoints/step-000500000.pt
# Paper-aligned lr=2e-5 + decoupled wd=0.3; Adam moment reset on fork.
# Standard K 1→20 ramp over this 250k-step Phase2 window; Kmax=20 at 750k.
curriculum:
  sparse_keyframe_cap_mode: adjacent_mix
  sparse_keyframes_max: 20
  phase2_steps: 250000
  sparse_channel_budget: 0
  sparse_same_frame_overlap_probability: 0.0

optimizer:
  name: adam_atan2
  learning_rate: 2.0e-5
  weight_decay: 0.3
  warmup_steps: 2000
  warmup_start_lr: 2.0e-6
  gradient_clip_norm: 1.0
  skip_gradient_norm: null

runtime:
  reset_optimizer: true
  max_steps_override: 750000
  checkpoint_every: 5000
  keep_last_checkpoints: 20
  milestone_every: 50000
