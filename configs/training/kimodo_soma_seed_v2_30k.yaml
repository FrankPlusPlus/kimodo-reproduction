# Production training profile for the benchmark-oriented V2 train-ready bundle.
# This is a complete method config, not a local experiment overlay. Company
# launchers select it with KIMODO_TRAINING_CONFIG; machine paths and hardware
# batch settings remain separate.
schema_version: 1
paper_method_strict: false

data:
  # Supplied by --paths; never commit company mount paths here.
  manifest: ""
  split: train
  fps: 30
  max_seconds: 10.0
  min_frames: 2
  num_workers: 8
  multiprocessing_context: fork
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  require_cached_text: true
  reference_verification: inventory
  reference_inventory: null
  require_paper_data_parity: false

model:
  checkpoint_dir: null
  checkpoint_weights: null
  skeleton_joints: 30
  stats_path: ""
  fps: 30
  num_diffusion_steps: 1000
  motion_mask_mode: concat
  llm_dim: 4096
  llm_tokens: 1
  num_text_tokens_override: 50
  latent_dim: 1024
  ff_size: 2048
  num_layers: 16
  num_heads: 8
  activation: gelu
  norm_first: false
  input_first_heading_angle: true
  use_text_mask: false
  detach_root_for_body: true

curriculum:
  phase1_steps: 20000
  phase2_steps: 10000
  phase1_dropout: 0.1
  phase2_dropout: 0.0
  text_dropout_probability: 0.1
  no_constraint_probability: 0.1
  mix_two_probability: 0.25
  sparse_keyframes_min: 1
  sparse_keyframes_max: 20
  sparse_count_power: 1.0
  dense_path_min_fraction: 0.2
  dense_path_max_fraction: 0.8
  root_heading_probability: 0.5
  # Explicit V2 engineering choices derived from the public benchmark shape.
  benchmark_coverage_probability: 0.25
  benchmark_sparse_keyframes_max: 9
  benchmark_sparse_count_power: 0.45

loss:
  # Six direct terms use the representation's normalized training domain.
  # KimodoLoss still evaluates FK after inverse normalization, in meters.
  direct_feature_domain: normalized
  smooth_l1_beta: 1.0
  root_position: 10.0
  root_heading: 2.0
  joint_position: 10.0
  joint_velocity: 3.0
  joint_rotation: 10.0
  foot_contact: 4.0
  forward_kinematics: 5.0

optimizer:
  name: adam_atan2
  learning_rate: 1.0e-5
  betas: [0.9, 0.999]
  weight_decay: 0.0
  atan2_lambda: 8.0
  gradient_clip_norm: 1.0

ema:
  enabled: true
  decay: 0.995
  update_every: 10

runtime:
  output_dir: ""
  seed: 1234
  device: auto
  precision: bf16
  batch_size: 128
  gradient_accumulation_steps: 1
  log_every: 10
  checkpoint_every: 5000
  milestone_every: 0
  keep_last_checkpoints: 4
  resume: null
  initial_global_step: 0
  distributed: auto
  # The hardware overlay records the actual world size/global batch.
  enforce_paper_scale: false
  dry_run: false
  max_steps_override: null
