# Trainable two-GPU BONES-SEED engineering reconstruction. Every paper-disclosed
# model/loss/curriculum value is retained; only hardware scale is reduced. The
# unavailable official Qwen/transition data recipe is explicitly not claimed.
schema_version: 1
paper_method_strict: false

data:
  manifest: ${oc.env:KIMODO_TRAINING_DATA,/home/yezitao/PublicWorkspace/yzt/kimodo-training-data}/train.cached.jsonl
  split: train
  fps: 30
  max_seconds: 10.0
  min_frames: 30
  num_workers: 16
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  require_cached_text: true
  reference_verification: inventory
  reference_inventory: ${oc.env:KIMODO_TRAINING_DATA,/home/yezitao/PublicWorkspace/yzt/kimodo-training-data}/train.cached.references.jsonl
  require_paper_data_parity: false

model:
  checkpoint_dir: null
  checkpoint_weights: null
  skeleton_joints: 30
  stats_path: ${oc.env:KIMODO_TRAINING_DATA,/home/yezitao/PublicWorkspace/yzt/kimodo-training-data}/stats/repro-soma30-30fps
  fps: 30
  num_diffusion_steps: 1000
  motion_mask_mode: concat
  llm_dim: 4096
  llm_tokens: 1
  num_text_tokens_override: 50
  latent_dim: 1024
  ff_size: 2048
  num_layers: 16
  num_heads: 8
  activation: gelu
  norm_first: false
  input_first_heading_angle: true
  use_text_mask: false
  # CODE default; false is an explicit gradient-coupled ablation.
  detach_root_for_body: true

curriculum:
  phase1_steps: 500000
  phase2_steps: 500000
  phase1_dropout: 0.1
  phase2_dropout: 0.0
  text_dropout_probability: 0.1
  no_constraint_probability: 0.1
  mix_two_probability: 0.25
  sparse_keyframes_min: 1
  sparse_keyframes_max: 20
  sparse_count_power: 1.0
  dense_path_min_fraction: 0.2
  dense_path_max_fraction: 0.8
  root_heading_probability: 0.5

loss:
  direct_feature_domain: physical
  smooth_l1_beta: 1.0
  root_position: 10.0
  root_heading: 2.0
  joint_position: 10.0
  joint_velocity: 3.0
  joint_rotation: 10.0
  foot_contact: 4.0
  forward_kinematics: 5.0

optimizer:
  name: adam_atan2
  learning_rate: 2.0e-5
  betas: [0.9, 0.999]
  weight_decay: 0.0
  atan2_lambda: 8.0
  gradient_clip_norm: 1.0

ema:
  enabled: true
  decay: 0.995
  update_every: 10

runtime:
  output_dir: ${oc.env:KIMODO_LOCAL_ROOT,/home/yezitao/PublicWorkspace/yzt/kimodo-reproduction}/outputs/kimodo-soma-seed-public-two-gpu
  seed: 1234
  device: auto
  precision: bf16
  # 2 ranks * 128 local * 8 accumulation = paper global batch 2048.
  # This is only ~5% slower than local 256 but uses ~56 rather than ~105 GiB.
  batch_size: 128
  gradient_accumulation_steps: 8
  log_every: 10
  checkpoint_every: 10000
  milestone_every: 100000
  keep_last_checkpoints: 3
  resume: null
  initial_global_step: 0
  distributed: auto
  enforce_paper_scale: false
  dry_run: false
  max_steps_override: null
