# Complete production profile for the company 16-H200 V2 run. The scheduler
# may partition the 16 ranks across 2x8, 4x4, or 16x1 launcher pods.
# Machine/PVC paths are the only external layer, supplied through --paths.
schema_version: 1
paper_method_strict: false

data:
  manifest: ""
  split: train
  fps: 30
  max_seconds: 10.0
  min_frames: 2
  # Per rank: local fixed-300f H200 tests measured 1.64/0.76/0.52 s per step
  # at 4/8/12 workers. Multi-node hostnet: 8 was slower than the prior 12 baseline
  # (~1.0 vs ~1.3 steps/s); default 16 to hide JuiceFS latency (128 workers/node).
  # Override with KIMODO_DATA_WORKERS. Loader fields are resume-whitelisted.
  num_workers: 16
  multiprocessing_context: fork
  pin_memory: true
  # Slightly deeper prefetch to hide JuiceFS latency behind GPU compute.
  # Resume-critical config ignores this field so 10k checkpoints can adopt it.
  prefetch_factor: 4
  # Keep workers alive across epochs. Epoch is process-shared on the dataset so
  # augmentation seeds still track set_epoch(); avoids ~8min JuiceFS respawn stalls.
  persistent_workers: true
  require_cached_text: true
  reference_verification: inventory
  reference_inventory: null
  require_paper_data_parity: false
  # Offline FK cache on the data PVC. Leave null while building; after ≥20k
  # checkpoint, resume with this path set (resume-whitelisted).
  # Example: /home/share/yezitao-kimodo-reproduction/feature-cache/v1
  feature_cache_dir: null

model:
  checkpoint_dir: null
  checkpoint_weights: null
  skeleton_joints: 30
  stats_path: ""
  fps: 30
  num_diffusion_steps: 1000
  motion_mask_mode: concat
  llm_dim: 4096
  llm_tokens: 1
  num_text_tokens_override: 50
  latent_dim: 1024
  ff_size: 2048
  num_layers: 16
  num_heads: 8
  activation: gelu
  norm_first: false
  input_first_heading_angle: true
  use_text_mask: false
  detach_root_for_body: true

curriculum:
  phase1_steps: 500000
  phase2_steps: 500000
  phase1_dropout: 0.1
  phase2_dropout: 0.0
  text_dropout_probability: 0.1
  no_constraint_probability: 0.1
  mix_two_probability: 0.25
  sparse_keyframes_min: 1
  sparse_keyframes_max: 20
  sparse_count_power: 1.0
  dense_path_min_fraction: 0.2
  dense_path_max_fraction: 0.8
  root_heading_probability: 0.5
  # V2 benchmark-oriented engineering lane; not an unpublished NVIDIA value.
  benchmark_coverage_probability: 0.25
  benchmark_sparse_keyframes_max: 9
  benchmark_sparse_count_power: 0.45

loss:
  direct_feature_domain: normalized
  smooth_l1_beta: 1.0
  root_position: 10.0
  root_heading: 2.0
  joint_position: 10.0
  joint_velocity: 3.0
  joint_rotation: 10.0
  foot_contact: 4.0
  forward_kinematics: 5.0

optimizer:
  name: adam_atan2
  learning_rate: 2.0e-5
  betas: [0.9, 0.999]
  weight_decay: 0.0
  atan2_lambda: 8.0
  gradient_clip_norm: 1.0

ema:
  enabled: true
  decay: 0.995
  update_every: 10

runtime:
  output_dir: ""
  seed: 1234
  device: auto
  precision: bf16
  # Per GPU/rank. 16 x 128 x 1 = effective global batch 2048.
  batch_size: 128
  gradient_accumulation_steps: 1
  # Less frequent metric allreduce + rank0 publish; resume ignores this field.
  log_every: 20
  checkpoint_every: 10000
  milestone_every: 100000
  keep_last_checkpoints: 3
  resume: null
  resume_mode: in_place
  initial_global_step: 0
  distributed: auto
  expected_world_size: 16
  expected_global_batch: 2048
  enforce_paper_scale: true
  dry_run: false
  max_steps_override: null
