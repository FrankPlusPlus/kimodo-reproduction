# Same code path as production, reduced only for CPU/GPU smoke validation.
schema_version: 1
paper_method_strict: false
data:
  manifest: tests/fixtures/training/manifest.jsonl
  split: train
  fps: 30
  max_seconds: 1.0
  min_frames: 2
  num_workers: 0
  pin_memory: false
  prefetch_factor: 2
  persistent_workers: false
  require_cached_text: true
  require_paper_data_parity: false
model:
  checkpoint_dir: null
  checkpoint_weights: null
  skeleton_joints: 30
  stats_path: tests/fixtures/training/stats
  fps: 30
  num_diffusion_steps: 1000
  motion_mask_mode: concat
  llm_dim: 16
  llm_tokens: 1
  num_text_tokens_override: 2
  latent_dim: 32
  ff_size: 64
  num_layers: 1
  num_heads: 4
  activation: gelu
  norm_first: false
  input_first_heading_angle: true
  use_text_mask: false
  detach_root_for_body: true
curriculum:
  phase1_steps: 1
  phase2_steps: 1
  phase1_dropout: 0.1
  phase2_dropout: 0.0
  text_dropout_probability: 0.1
  no_constraint_probability: 0.1
  mix_two_probability: 0.25
  sparse_keyframes_min: 1
  sparse_keyframes_max: 2
  sparse_count_power: 1.0
  dense_path_min_fraction: 0.2
  dense_path_max_fraction: 0.8
  root_heading_probability: 0.5
loss:
  direct_feature_domain: normalized
  smooth_l1_beta: 1.0
  root_position: 10.0
  root_heading: 2.0
  joint_position: 10.0
  joint_velocity: 3.0
  joint_rotation: 10.0
  foot_contact: 4.0
  forward_kinematics: 5.0
optimizer:
  name: adam_atan2
  learning_rate: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0
  atan2_lambda: 8.0
  gradient_clip_norm: 1.0
ema:
  enabled: true
  decay: 0.995
  update_every: 1
runtime:
  output_dir: outputs/tiny-smoke
  seed: 1234
  device: cpu
  precision: fp32
  batch_size: 2
  gradient_accumulation_steps: 1
  log_every: 1
  checkpoint_every: 1
  milestone_every: 0
  keep_last_checkpoints: 3
  resume: null
  initial_global_step: 0
  distributed: auto
  dry_run: false
  max_steps_override: null
