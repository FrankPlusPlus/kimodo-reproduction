# 中文逐字段说明见同目录 CONFIG_REFERENCE.zh-CN.md。
# Kimodo paper-aligned production defaults. Values not explicitly disclosed by
# the paper remain explicit fail-closed checks in this configuration and trainer.
schema_version: 1
paper_method_strict: true

data:
  # Supplied by --paths. This profile remains blocked until the unavailable
  # paper augmentation assets satisfy the strict parity gate.
  manifest: ""
  split: train
  fps: 30
  max_seconds: 10.0
  # The paper discloses only the 10 s maximum, not a training minimum.
  min_frames: 2
  num_workers: 8
  multiprocessing_context: fork
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  require_cached_text: true
  reference_verification: inventory
  reference_inventory: null
  # Fail-closed paper-asset schema gate. This intentionally rejects plain BONES-SEED
  # manifest until Qwen3-32B paraphrases and diffusion-transition stitched clips
  # with provenance have been supplied, but cannot certify NVIDIA's unpublished recipe.
  require_paper_data_parity: true

model:
  checkpoint_dir: null
  checkpoint_weights: null
  skeleton_joints: 30
  stats_path: ""
  fps: 30
  num_diffusion_steps: 1000
  motion_mask_mode: concat
  llm_dim: 4096
  llm_tokens: 1
  num_text_tokens_override: 50
  latent_dim: 1024
  ff_size: 2048
  num_layers: 16
  num_heads: 8
  activation: gelu
  norm_first: false
  input_first_heading_angle: true
  use_text_mask: false
  # CODE: the released denoiser's training-mode forward detaches this bridge.
  # PAPER "end-to-end" is interpreted here as joint interleaved optimization;
  # the paper does not specify cross-bridge autograd and no trainer was released.
  detach_root_for_body: true

curriculum:
  phase1_steps: 500000
  phase2_steps: 500000
  phase1_dropout: 0.1
  phase2_dropout: 0.0
  text_dropout_probability: 0.1
  no_constraint_probability: 0.1
  mix_two_probability: 0.25
  sparse_keyframes_min: 1
  sparse_keyframes_max: 20
  sparse_count_power: 1.0
  dense_path_min_fraction: 0.2
  dense_path_max_fraction: 0.8
  root_heading_probability: 0.5

loss:
  # Engineering default selected by our ablation; the paper does not disclose it.
  direct_feature_domain: normalized
  smooth_l1_beta: 1.0
  root_position: 10.0
  root_heading: 2.0
  joint_position: 10.0
  joint_velocity: 3.0
  joint_rotation: 10.0
  foot_contact: 4.0
  forward_kinematics: 5.0

optimizer:
  name: adam_atan2
  learning_rate: 2.0e-5
  betas: [0.9, 0.999]
  weight_decay: 0.0
  atan2_lambda: 8.0
  gradient_clip_norm: 1.0

ema:
  enabled: true
  decay: 0.995
  update_every: 10

runtime:
  output_dir: ""
  seed: 1234
  device: auto
  precision: bf16
  batch_size: 128
  gradient_accumulation_steps: 1
  log_every: 10
  checkpoint_every: 10000
  milestone_every: 100000
  keep_last_checkpoints: 3
  resume: null
  initial_global_step: 0
  distributed: auto
  enforce_paper_scale: true
  dry_run: false
  max_steps_override: null
