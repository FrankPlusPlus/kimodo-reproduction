[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kimodo"
version = "1.0.0"
description = "Kimodo motion generation model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
  "huggingface-hub>=0.30",
  "numpy>=1.23",
  "scipy>=1.10",
  "transformers==5.1.0",
  "urllib3>=2.6.3",
  "boto3",
  "peft>=0.18",
  "einops>=0.7",
  "tqdm>=4.0",
  "packaging>=21.0",
  "pydantic>=2.0",
  "filelock>=3.20.3",
  "gradio>=6.8.0",
  "gradio_client>=1.0",
  "trimesh>=3.21.7",
  "scenepic>=1.1.0",
  "pillow>=9.0",
  "av>=16.1.0",
  "bvhio",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "pytest>=8.0",
  "pyyaml>=6.0",
]
monitoring = [
  "wandb>=0.19,<1",
]
demo = [
  "viser @ git+https://github.com/nv-tlabs/kimodo-viser.git",
]
soma = [
  "py-soma-x @ git+https://github.com/NVlabs/SOMA-X.git"
]
all = [
  "viser @ git+https://github.com/nv-tlabs/kimodo-viser.git",
  "py-soma-x @ git+https://github.com/NVlabs/SOMA-X.git"
]

[project.scripts]
kimodo_gen = "kimodo.scripts.generate:main"
kimodo_demo = "kimodo.demo:main"
kimodo_textencoder = "kimodo.scripts.run_text_encoder_server:main"
kimodo_convert = "kimodo.scripts.motion_convert:main"
kimodo_train = "kimodo.training.cli:main"
kimodo_build_feature_cache = "kimodo.training.feature_cache_cli:main"
kimodo_compute_stats = "kimodo.data_pipeline.stats_cli:main"
kimodo_cache_text = "kimodo.data_pipeline.text_cache_cli:main"
kimodo_build_manifest = "kimodo.data_pipeline.manifest_cli:main"
kimodo_prepare_timeline_v2 = "kimodo.data_pipeline.v2.timeline_multi_cli:main"
kimodo_generate_qwen_v2 = "kimodo.data_pipeline.v2.qwen_augmentation_cli:main"
kimodo_generate_llm_v2 = "kimodo.data_pipeline.v2.llm_api_augmentation_cli:main"
kimodo_audit_llm_v2 = "kimodo.data_pipeline.v2.llm_quality_cli:main"
kimodo_build_manifest_v2 = "kimodo.data_pipeline.v2.v2_manifest_cli:main"
kimodo_cache_manifest_v2 = "kimodo.data_pipeline.v2.v2_cached_manifest_cli:main"
kimodo_mix_manifest = "kimodo.data_pipeline.manifest_overlay_cli:main"
kimodo_create_smoke_fixture = "kimodo.devtools.smoke_fixture_cli:main"
kimodo_reference_inventory = "kimodo.data_pipeline.reference_inventory_cli:main"
kimodo_benchmark_train = "kimodo.evaluation.benchmark_cli:main"
kimodo_build_core_subset = "kimodo.devtools.core_subset_cli:main"
kimodo_validate_checkpoint = "kimodo.evaluation.validation_cli:main"
kimodo_monitor_benchmark = "kimodo.evaluation.eval_monitor_cli:main"
kimodo_resources = "kimodo.resources.cli:main"
kimodo_prepare_bones = "kimodo.resources.bones:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
kimodo = ["assets/**/*"]

[tool.flake8]
max-line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I001"]  # Enable import sorting

[tool.ruff.lint.isort]
known-first-party = ["kimodo"]
known-third-party = ["torch", "numpy", "pytorch_lightning", "wandb", "tqdm"]
force-sort-within-sections = false
