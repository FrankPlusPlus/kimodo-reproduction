<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img">
  <defs>
    <style>
      .en { font-family: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a554e"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6f8f"/>
    </marker>
  </defs>

  <rect width="1400" height="540" fill="#ffffff"/>
  <text class="en" x="36" y="40" font-size="24" font-weight="700" fill="#2f6f8f">INFERENCE</text>
  <text class="en" x="190" y="40" font-size="18" fill="#3d4a42">No GT  ·  start from noise  ·  DDIM loop  ·  exit = motion</text>

  <g id="node-uin" class="node">
    <rect x="28" y="80" width="180" height="160" rx="10" fill="#e8f2f7" stroke="#2f6f8f" stroke-width="2.2"/>
    <text class="en" x="118" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6f8f">User Input</text>
    <text class="en" x="118" y="165" text-anchor="middle" font-size="16" fill="#14201a">text · constraints</text>
    <text class="en" x="118" y="200" text-anchor="middle" font-size="16" fill="#a84d62" font-weight="700">NO GT motion</text>
  </g>
  <line x1="208" y1="160" x2="246" y2="160" stroke="#4a554e" stroke-width="2.2" marker-end="url(#arr)"/>

  <g id="node-init" class="node">
    <rect x="248" y="100" width="170" height="120" rx="10" fill="#f7f8f7" stroke="#7a857e" stroke-width="1.8"/>
    <text class="en" x="333" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#14201a">Init noise</text>
    <text class="en" x="333" y="185" text-anchor="middle" font-size="15" fill="#5a635c">+ CFG null text</text>
  </g>
  <line x1="418" y1="160" x2="456" y2="160" stroke="#4a554e" stroke-width="2.2" marker-end="url(#arr)"/>

  <g id="node-loop" class="node">
    <rect x="458" y="70" width="680" height="290" rx="16" fill="#f2f8fb" stroke="#2f6f8f" stroke-width="2.6" stroke-dasharray="9 6"/>
    <text class="en" x="798" y="102" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6f8f">DDIM loop</text>

    <g id="node-i-const">
      <rect x="486" y="130" width="140" height="100" rx="10" fill="#f3f0f9" stroke="#5b4d8a" stroke-width="2"/>
      <text class="en" x="556" y="175" text-anchor="middle" font-size="18" font-weight="700" fill="#5b4d8a">Overwrite</text>
      <text class="en" x="556" y="205" text-anchor="middle" font-size="14" fill="#3d4a42">user constr.</text>
    </g>
    <line x1="626" y1="180" x2="658" y2="180" stroke="#4a554e" stroke-width="2" marker-end="url(#arr)"/>

    <g id="node-i-denoise">
      <rect x="660" y="124" width="200" height="112" rx="10" fill="#eef6f0" stroke="#1f6b4a" stroke-width="2"/>
      <text class="en" x="760" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6b4a">Denoiser</text>
      <text class="en" x="760" y="200" text-anchor="middle" font-size="14" fill="#14201a">Root → Body</text>
    </g>
    <line x1="860" y1="180" x2="892" y2="180" stroke="#4a554e" stroke-width="2" marker-end="url(#arr)"/>

    <g id="node-i-cfg">
      <rect x="894" y="130" width="100" height="100" rx="10" fill="#fff" stroke="#8a6d3b" stroke-width="2"/>
      <text class="en" x="944" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#8a6d3b">CFG</text>
    </g>
    <line x1="994" y1="180" x2="1026" y2="180" stroke="#4a554e" stroke-width="2" marker-end="url(#arr)"/>

    <g id="node-i-ddim">
      <rect x="1028" y="130" width="80" height="100" rx="10" fill="#2f6f8f"/>
      <text class="en" x="1068" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">DDIM</text>
    </g>

    <path d="M1068 240 L1068 300 L556 300 L556 230" fill="none" stroke="#2f6f8f" stroke-width="2.4" marker-end="url(#arrB)"/>
    <text class="en" x="798" y="288" text-anchor="middle" font-size="16" font-weight="600" fill="#2f6f8f">step down until clean</text>
    <text class="en" x="798" y="338" text-anchor="middle" font-size="14" fill="#5a635c">more steps → slower, usually sharper</text>
  </g>

  <line x1="1138" y1="200" x2="1180" y2="200" stroke="#4a554e" stroke-width="2.2" marker-end="url(#arr)"/>

  <g id="node-out" class="node">
    <rect x="1182" y="110" width="190" height="170" rx="10" fill="#eef6f0" stroke="#1f6b4a" stroke-width="2.2"/>
    <text class="en" x="1277" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#1f6b4a">Motion Out</text>
    <text class="en" x="1277" y="205" text-anchor="middle" font-size="15" fill="#3d4a42">denorm / skeleton</text>
    <text class="en" x="1277" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#a84d62">NO Loss</text>
  </g>

  <rect x="28" y="390" width="1344" height="120" rx="10" fill="#eef4f8" stroke="#b7c9d4"/>
  <text class="en" x="56" y="432" font-size="18" font-weight="700" fill="#2f6f8f">Hard differences vs TRAINING</text>
  <text class="en" x="56" y="468" font-size="16" fill="#3d4a42">Input = user conditions   ·   Outer loop = DDIM   ·   Exit = motion (not Loss)</text>
  <text class="en" x="56" y="498" font-size="16" fill="#3d4a42">Shared kernel only: Two-Stage Transformer Denoiser (+ overwrite)</text>
</svg>
