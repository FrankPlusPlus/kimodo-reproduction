<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img">
  <defs>
    <style>.en{font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;}</style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d4a42"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="#ffffff"/>

  <text class="en" x="40" y="34" font-size="24" font-weight="700" fill="#2f6f8f">推理每步 t 仍查同一张正弦 PE 表</text>
  <text class="en" x="40" y="60" font-size="16" fill="#3d4a42">不另建 timestep 词表。默认 10 步 DDIM 从训练用过的 0-999 抽 10 行，取出 1024 维再走 Linear-SiLU-Linear。</text>

  <rect x="40" y="78" width="1520" height="112" rx="12" fill="#e8f2f7" stroke="#2f6f8f" stroke-width="2"/>
  <text class="en" x="60" y="106" font-size="18" font-weight="700" fill="#2f6f8f">A. 默认 10 步：从高噪声走到干净</text>
  <text class="en" x="60" y="128" font-size="14" fill="#3d4a42">循环下标 9 到 0，映射回训练步 999, 888, ..., 0（间隔 111）</text>

  <rect x="60" y="140" width="86" height="38" rx="8" fill="#2f6f8f"/>
  <text class="en" x="103" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">999</text>
  <path d="M150 159 L168 159" stroke="#3d4a42" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="172" y="140" width="86" height="38" rx="8" fill="#8fb7c9"/>
  <text class="en" x="215" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#14201a">888</text>
  <path d="M262 159 L280 159" stroke="#3d4a42" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="284" y="140" width="86" height="38" rx="8" fill="#8fb7c9"/>
  <text class="en" x="327" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#14201a">777</text>
  <path d="M374 159 L392 159" stroke="#3d4a42" stroke-width="2" marker-end="url(#arr)"/>
  <text class="en" x="430" y="164" text-anchor="middle" font-size="22" font-weight="700" fill="#2f6f8f">...</text>
  <path d="M456 159 L474 159" stroke="#3d4a42" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="478" y="140" width="86" height="38" rx="8" fill="#8fb7c9"/>
  <text class="en" x="521" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#14201a">111</text>
  <path d="M568 159 L586 159" stroke="#3d4a42" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="590" y="140" width="86" height="38" rx="8" fill="#1f6b4a"/>
  <text class="en" x="633" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">0</text>
  <text class="en" x="720" y="156" font-size="15" fill="#3d4a42">本步把这个整数 t 交给 Denoiser</text>
  <text class="en" x="720" y="176" font-size="14" fill="#6a756e">不是 0-9 的循环计数，是映射后的训练步</text>

  <rect x="40" y="208" width="740" height="328" rx="12" fill="#fff8ea" stroke="#8a6d3b" stroke-width="2.5"/>
  <text class="en" x="60" y="242" font-size="20" font-weight="700" fill="#8a6d3b">B. 查 PE 表：t 当行号，取出 1024 维</text>
  <text class="en" x="60" y="270" font-size="15" fill="#3d4a42">与训练共用 sequence_pos_encoder.pe · 5000 x 1024 · 实际只用 0-999</text>

  <rect x="70" y="292" width="300" height="220" rx="10" fill="#fff" stroke="#8a6d3b" stroke-width="2"/>
  <text class="en" x="220" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6d3b">sinusoidal PE 表</text>
  <rect x="90" y="334" width="220" height="28" rx="4" fill="#8fb7c9"/>
  <text class="en" x="200" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#14201a">row 0</text>
  <rect x="90" y="366" width="220" height="28" rx="4" fill="#d7e6ee" stroke="#c5d3e0"/>
  <text class="en" x="200" y="385" text-anchor="middle" font-size="14" fill="#3d4a42">row 111    DDIM</text>
  <rect x="90" y="398" width="220" height="36" rx="4" fill="#2f6f8f"/>
  <text class="en" x="200" y="421" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">row t  本步取出</text>
  <rect x="90" y="438" width="220" height="28" rx="4" fill="#d7e6ee" stroke="#c5d3e0"/>
  <text class="en" x="200" y="457" text-anchor="middle" font-size="14" fill="#3d4a42">row 888    DDIM</text>
  <rect x="90" y="470" width="220" height="28" rx="4" fill="#8fb7c9"/>
  <text class="en" x="200" y="489" text-anchor="middle" font-size="14" font-weight="700" fill="#14201a">row 999</text>

  <path d="M380 416 L430 416" stroke="#3d4a42" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="438" y="372" width="310" height="88" rx="10" fill="#2f6f8f"/>
  <text class="en" x="593" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">PE[t]  in  R^1024</text>
  <text class="en" x="593" y="438" text-anchor="middle" font-size="15" fill="#d0e4ef">shape [B, 1, 1024]</text>

  <rect x="800" y="208" width="760" height="328" rx="12" fill="#e8f3ec" stroke="#1f6b4a" stroke-width="2.5"/>
  <text class="en" x="820" y="242" font-size="20" font-weight="700" fill="#1f6b4a">C. 同宽 MLP（训练 / 推理同一套权重）</text>
  <text class="en" x="820" y="270" font-size="15" fill="#3d4a42">维数始终 1024，没有升维或降维</text>

  <rect x="840" y="310" width="150" height="78" rx="10" fill="#fff" stroke="#1f6b4a" stroke-width="2"/>
  <text class="en" x="915" y="342" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b4a">Linear</text>
  <text class="en" x="915" y="366" text-anchor="middle" font-size="13" fill="#3d4a42">1024 to 1024</text>
  <path d="M990 349 L1020 349" stroke="#3d4a42" stroke-width="2.4" marker-end="url(#arr)"/>
  <rect x="1024" y="310" width="130" height="78" rx="10" fill="#1f6b4a"/>
  <text class="en" x="1089" y="354" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">SiLU</text>
  <path d="M1154 349 L1184 349" stroke="#3d4a42" stroke-width="2.4" marker-end="url(#arr)"/>
  <rect x="1188" y="310" width="150" height="78" rx="10" fill="#fff" stroke="#1f6b4a" stroke-width="2"/>
  <text class="en" x="1263" y="342" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b4a">Linear</text>
  <text class="en" x="1263" y="366" text-anchor="middle" font-size="13" fill="#3d4a42">1024 to 1024</text>
  <path d="M1338 349 L1368 349" stroke="#3d4a42" stroke-width="2.4" marker-end="url(#arr)"/>
  <rect x="1372" y="310" width="160" height="78" rx="10" fill="#1f6b4a"/>
  <text class="en" x="1452" y="342" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">emb_t</text>
  <text class="en" x="1452" y="366" text-anchor="middle" font-size="13" fill="#d8efe0">[B,1,1024]</text>

  <text class="en" x="820" y="440" font-size="16" fill="#14201a">然后拼进 52 prefix（text + 49 zero + t + heading），和训练同一条条件通路。</text>
  <text class="en" x="820" y="472" font-size="15" fill="#6a756e">训练：均匀抽 1 行。推理：同一张表抽 10 行。t&gt;=5000 会越界，官方设定不会发生。</text>
</svg>
