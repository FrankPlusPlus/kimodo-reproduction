<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" role="img">
  <defs>
    <style>.en{font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;}</style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d4a42"/>
    </marker>
  </defs>
  <text class="en" x="40" y="36" font-size="18" font-weight="700" fill="#2f6f8f">马尔可夫前向过程</text>
  <text class="en" x="220" y="36" font-size="15" fill="#6a756e">N = 1000 · cosine</text>

  <rect x="60" y="70" width="150" height="100" rx="12" fill="#1f6b4a"/>
  <text class="en" x="135" y="115" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">x0</text>
  <text class="en" x="135" y="145" text-anchor="middle" font-size="16" fill="#d8efe0">clean</text>

  <path d="M210 120 L265 120" stroke="#3d4a42" stroke-width="3" marker-end="url(#a)"/>
  <text class="en" x="237" y="105" text-anchor="middle" font-size="15" fill="#6a756e">β1</text>

  <rect x="270" y="70" width="130" height="100" rx="12" fill="#fff" stroke="#2f6f8f" stroke-width="2.5"/>
  <text class="en" x="335" y="130" text-anchor="middle" font-size="28" font-weight="700" fill="#2f6f8f">x1</text>

  <path d="M400 120 L455 120" stroke="#3d4a42" stroke-width="3" marker-end="url(#a)"/>

  <rect x="460" y="70" width="110" height="100" rx="12" fill="#fff" stroke="#2f6f8f" stroke-width="2.5"/>
  <text class="en" x="515" y="130" text-anchor="middle" font-size="28" font-weight="700" fill="#2f6f8f">···</text>

  <path d="M570 120 L625 120" stroke="#3d4a42" stroke-width="3" marker-end="url(#a)"/>
  <text class="en" x="597" y="105" text-anchor="middle" font-size="15" fill="#6a756e">βt</text>

  <rect x="630" y="70" width="150" height="100" rx="12" fill="#2f6f8f"/>
  <text class="en" x="705" y="115" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">xt</text>
  <text class="en" x="705" y="145" text-anchor="middle" font-size="16" fill="#d0e4ef">noisy</text>

  <path d="M780 120 L835 120" stroke="#3d4a42" stroke-width="3" marker-end="url(#a)"/>

  <rect x="840" y="70" width="110" height="100" rx="12" fill="#fff" stroke="#2f6f8f" stroke-width="2.5"/>
  <text class="en" x="895" y="130" text-anchor="middle" font-size="28" font-weight="700" fill="#2f6f8f">···</text>

  <path d="M950 120 L1005 120" stroke="#3d4a42" stroke-width="3" marker-end="url(#a)"/>

  <rect x="1010" y="70" width="150" height="100" rx="12" fill="#5b4d8a"/>
  <text class="en" x="1085" y="115" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">xN</text>
  <text class="en" x="1085" y="145" text-anchor="middle" font-size="16" fill="#ddd6ee">≈ noise</text>

  <rect x="1220" y="78" width="340" height="84" rx="10" fill="#f4f7f5" stroke="#d5ddd7"/>
  <text class="en" x="1390" y="112" text-anchor="middle" font-size="16" fill="#3d4a42">训练不逐步走完整条链</text>
  <text class="en" x="1390" y="142" text-anchor="middle" font-size="16" fill="#1f6b4a">用下方闭式一次跳到 xt</text>
</svg>
